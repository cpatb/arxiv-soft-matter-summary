id: blood_horner2020_donor_N_newtonian
fluid: human whole blood, donor N (Horner 2020), hematocrit 51.3 %, fibrinogen 247 mg/dL
model: newtonian
parameters:
  mu: {value: 0.0216, unit: Pa*s}
envelope:
  gammadot_min: {value: 0.1, unit: 1/s}
  gammadot_max: {value: 700, unit: 1/s}
  temperature_C: 37
  geometry: ARES-G2 double-wall concentric cylinder, EDTA-anticoagulated whole blood, rate sweep
sources:
  - {doi: 10.1007/s00397-023-01402-2, role: paper}
licence:
  name: not stated (author-posted workbook; Horner 2020 dissertation citation requested)
  commercial_use: false
notes: >-
  newtonian fit (eta = mu) by biorheo.identify to the 16-point steady-shear curve,
  log-viscosity residuals. Objective: unweighted least squares on log(eta), the same one
  used for this donor's Casson record blood_horner2020_donor_N. The source study publishes no newtonian
  table, so unlike the Casson record there is nothing here to reproduce and these numbers
  are biorheo's fit alone. This family fits the curve rmse 0.995 against Casson's
  0.186, at the price of the verdicts in the sidecar. THIS IS A NULL MODEL, not a description of blood: eta = mu at every rate, the constant every other family has to beat. It is in the registry so the L3 OpenFOAM bridge has a `newtonian` record to gate against and so the model comparison has a null column, not because blood is Newtonian over this envelope -- it is not. Not a
  licensed dataset: for validation and demonstration only.
