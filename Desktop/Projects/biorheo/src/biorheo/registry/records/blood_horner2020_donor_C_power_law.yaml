notes: >-
  power_law fit (eta = k gd^(n-1)) by biorheo.identify to the 16-point steady-shear curve,
  log-viscosity residuals. Objective: unweighted least squares on log(eta), the same one
  used for this donor's Casson record blood_horner2020_donor_C. The source study publishes no power_law
  table, so unlike the Casson record there is nothing here to reproduce and these numbers
  are biorheo's fit alone. This family fits the curve rmse 0.285 against Casson's
  0.068, at the price of the verdicts in the sidecar. THIS IS A NULL MODEL for this envelope: eta = k gd^(n-1) has no plateau and diverges as gd -> 0, so it cannot describe the low-rate end of a blood curve. It is in the registry so the L3 OpenFOAM bridge has a `power_law` record to gate against. Not a
  licensed dataset: for validation and demonstration only.
